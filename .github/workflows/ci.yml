name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Space separated published lucee-express versions to assemble and boot'
        default: ''
  schedule:
    - cron: '17 4 * * 1'

jobs:
  fake-repo:
    name: Fake repo tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: sh tests/fake-repo-test.sh

  published:
    name: Assemble published versions (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Assemble with java, boot, compare against the other assemblers
        shell: bash
        env:
          VERSIONS: ${{ github.event.inputs.versions }}
        run: |
          VERSIONS=${VERSIONS:-$(cat tests/published-versions.txt | tr '\n' ' ')}
          for v in $VERSIONS; do
            java LuceeExpress.java "$v" "$RUNNER_TEMP/java-$v" --cache "$RUNNER_TEMP/cache"
            if [ "$RUNNER_OS" != Windows ]; then
              LUCEE_EXPRESS_CACHE="$RUNNER_TEMP/cache-sh" sh ./lucee-express.sh "$v" "$RUNNER_TEMP/sh-$v"
              diff -r "$RUNNER_TEMP/java-$v" "$RUNNER_TEMP/sh-$v"
              sh tests/boot-test.sh "$RUNNER_TEMP/java-$v" "$v"
            fi
          done
      - name: PowerShell assembler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $versions = if ($env:VERSIONS) { $env:VERSIONS -split ' ' } else { Get-Content tests/published-versions.txt }
          foreach ($v in $versions) {
            ./lucee-express.ps1 $v "$env:RUNNER_TEMP\ps-$v"
            $a = Get-ChildItem -Recurse -File "$env:RUNNER_TEMP\ps-$v" | ForEach-Object { $_.FullName.Substring("$env:RUNNER_TEMP\ps-$v".Length) -replace '\\','/' } | Sort-Object
            $b = Get-ChildItem -Recurse -File "$env:RUNNER_TEMP\java-$v" | ForEach-Object { $_.FullName.Substring("$env:RUNNER_TEMP\java-$v".Length) -replace '\\','/' } | Sort-Object
            if (Compare-Object $a $b) { throw "tree mismatch for $v" }
          }
        env:
          VERSIONS: ${{ github.event.inputs.versions }}
